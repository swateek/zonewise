# Deploys the Vite build to Cloudflare Pages project "zonewise".
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard
name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Pin LTS — `latest` currently resolves to Node 26 and breaks wrangler.
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          # Checkout is already the tag (or workflow_dispatch ref).
          # --branch=main only aliases this build to production (zonewise.pages.dev);
          # without it, detached HEAD publishes a preview at head.*.pages.dev.
          command: >-
            pages deploy dist
            --project-name=zonewise
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-message=${{ github.ref_name }}
